<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../mainStyle.css">
  <title>Document</title>
</head>
<body>
  
    <h1>Практика з float та clear</h1>

    <img class="image-left" src="https://wpcdn.web.wsu.edu/news/uploads/sites/2797/2025/03/cat2-1024x676.jpg" alt="Кіт">

    <p>
        Ця фотографія має властивість float: left, тому текст обтікає її
        з правого боку. Так можна розміщувати зображення поруч із текстом.
    </p>

    <p class="clear">
        Цей текст має властивість clear: both, тому він починається
        нижче зображення і більше його не обтікає.
    </p>

</body>
</html>
